<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TCT 患者复核表 · Cervical Validation</title><link rel="stylesheet" href="./style.css?v=patient1"></head>
<body><header><strong>Cervical Validation</strong><span>TCT 复核表</span></header>
<main><section id="login" class="login"><h1>TCT 复核表</h1><form id="loginForm"><label>您的姓名或代号<input id="reviewer" required maxlength="80" autocomplete="name"></label><label>访问码<input id="code" type="password" required autocomplete="off"></label><button class="primary" type="submit">打开表格</button></form><p id="loginError" role="alert"></p></section>
<section id="workspace" hidden><div class="toolbar"><div class="title"><h1>TCT 患者复核表</h1><span id="total"></span></div><div class="tools"><input id="search" placeholder="搜索患者姓名 / 编号 / 医院" aria-label="搜索"><button id="save" class="primary">保存修改</button><button id="export" hidden>下载全部反馈 CSV</button><button id="logout">退出</button></div></div>
<p class="hint">每位患者一行。黄色两列填写修正结果，离开单元格后自动保存。年龄及日期如有多个原表值会全部列出；检查日期来自原表扫描日期，并非已确认的 TCT 检查日期。</p>
<div id="sheet" class="sheet" tabindex="0" aria-label="TCT患者复核表，可上下及左右滚动"><table><colgroup><col class="rownum"><col class="name"><col class="patient-id"><col class="age"><col class="hospital"><col class="date"><col class="original"><col class="original"><col class="correction"><col class="correction"></colgroup><thead><tr><th scope="col" aria-label="行号"></th><th scope="col">患者姓名</th><th scope="col">患者编号</th><th scope="col">年龄（原表）</th><th scope="col">医院</th><th scope="col">检查日期</th><th scope="col">术前TCT</th><th scope="col">术后TCT</th><th scope="col" class="editable">修正术前TCT</th><th scope="col" class="editable">修正术后TCT</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>没有符合搜索条件的记录。</p></div>
<div class="statusbar"><span id="visibleCount"></span><span id="saveStatus" role="status" aria-live="polite"></span></div></section></main><script src="./app.js?v=patient1" defer></script></body></html>
