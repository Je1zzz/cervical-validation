<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TCT 复核 · Cervical Validation</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><span class="brand">CERVICAL VALIDATION</span><h1>TCT 报告复核</h1></div><span class="badge">医生协作 · 测试版</span></header>
<main><section id="login" class="card login"><span class="eyebrow">WELCOME / 欢迎</span><h2>从一份报告开始</h2><p>请在医院系统查阅原始 TCT 报告，再填写修正结果。</p><form id="loginForm"><label>您的姓名或代号<input id="reviewer" required maxlength="80" autocomplete="name"></label><label>访问码<input id="code" type="password" required autocomplete="off"></label><button class="primary" type="submit">进入复核工作台 →</button></form><p id="loginError" role="alert"></p><small>无需注册。患者信息仅在验证访问码后加载。</small></section>
<section id="workspace" hidden><div class="toolbar"><div><h2>待复核清单 <span id="total"></span></h2><p id="progress"></p></div><div><button id="export" hidden>下载全部反馈 CSV</button><button id="logout">退出</button></div></div>
<div class="filters"><input id="search" placeholder="查找患者姓名 / WSI 文件名" aria-label="搜索"><select id="time" aria-label="时间点"><option value="both">术前或术后命中</option><option value="pre">仅看术前命中</option><option value="post">仅看术后命中</option></select><select id="category" aria-label="类别"><option value="all">全部五类</option><option>missing</option><option>uncertain</option><option>reactive_changes</option><option>SCC_suspected</option><option>LSIL/ASC-H</option></select><select id="status" aria-label="复核状态"><option value="all">全部状态</option><option value="pending">未完成</option><option value="done">已复核</option></select></div>
<div class="layout"><aside class="card"><div class="list-title">病例 / WSI <span id="filtered"></span></div><div id="caseList"></div></aside><section class="card detail"><div id="empty" hidden>没有符合条件的记录。</div><div id="detail"><div class="case-heading"><div><span id="caseId" class="eyebrow"></span><h2 id="patient"></h2></div><span id="caseStatus" class="state"></span></div><dl><dt>扫描日期</dt><dd id="date"></dd><dt>WSI 文件名</dt><dd id="filename"></dd></dl><p class="notice">日期来自原表 WSI 扫描日期，并非 TCT 检查日期。请据患者信息核对原始报告。</p><div id="sides"></div><label>备注（可选）<textarea id="note" rows="2" maxlength="2000" placeholder="例如：报告日期、查找情况、需要进一步确认的问题"></textarea></label><div class="actions"><button id="prev">← 上一条</button><span id="position"></span><button id="next">下一条 →</button><button class="primary" id="save">保存本条复核</button></div><p id="saveStatus" role="status" aria-live="polite"></p></div></section></div></section>
</main><footer>保留原始记录 · 修正结果独立保存 · missing 不自动视为未检查或失访</footer><script src="./app.js" defer></script></body></html>
