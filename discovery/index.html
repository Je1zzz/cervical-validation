<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宫颈形态 · 医生复核</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">宫颈病理 · 形态研究</span><h1>看图，留下您的判断</h1><p>没有标准答案提示。视野不足时，请选择“无法判断”或“不适用”。</p></header><section id="login"><label>您的代号<input id="reviewer" autocomplete="username" maxlength="80" placeholder="用于区分独立评分"></label><label>医生访问码<input id="code" type="password" autocomplete="current-password"></label><button id="enter">进入复核</button></section><section id="workspace" hidden><div class="toolbar"><span id="progress"></span><button id="export" hidden>导出全部反馈</button><button id="logout" class="secondary">退出</button></div><progress id="bar" value="0" max="1"></progress><article><h2 id="title"></h2><p id="prompt" class="prompt"></p><div id="images"></div><form id="answer"></form><label>补充说明（可不填）<textarea id="note" rows="3" maxlength="2000" placeholder="图像不清、定义不合适，或您认为需要补充的内容"></textarea></label><div class="actions"><button id="previous" class="secondary">上一题</button><button id="save">保存并继续</button><button id="skip" class="secondary">暂时跳过</button></div></article></section><p id="status" role="status" aria-live="polite"></p><footer>仅供研究复核，不用于临床诊断。图中比例尺表示组织物理距离。</footer></main><dialog id="zoom"><button id="closeZoom">关闭大图</button><img alt="放大图像" id="zoomImage"></dialog><script src="app.js"></script></body></html>
